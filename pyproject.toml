[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "independent-ai-council"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.32,<1", "pydantic-settings>=2.6,<3", "httpx>=0.28,<1", "reportlab>=4.4,<5", "google-genai>=2.33,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
include = ["council*"]

[tool.setuptools.package-data]
council = ["prompts/*.txt", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
